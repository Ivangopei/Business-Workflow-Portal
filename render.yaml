# Render Blueprint: creates the Atlas API and its PostgreSQL database.
# In Render: New + -> Blueprint -> pick this repo. Render reads this file.
databases:
  - name: atlas-db
    plan: free
    databaseName: atlas
    user: atlas

services:
  - type: web
    name: atlas-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true # redeploys on every push to main (when connected through the Render GitHub app)
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render makes a random secret; it never lives in the repo
